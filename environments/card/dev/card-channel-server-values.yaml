replicaCount: 1

image:
  repository: 099622554242.dkr.ecr.ap-northeast-2.amazonaws.com/won-card-channel-server
  tag: main-10a7ed1

service:
  type: LoadBalancer
  port: 80
  targetPort: 8081

spring:
  profile: prod

env:
  - name: SERVER_PORT
    value: "8081"

config:
  enabled: true
  data:
    MYSQL_PORT: "3306"
    MYSQL_DATABASE: won_card_channel_db
    AWS_REGION: ap-northeast-2
    AWS_SQS_ENDPOINT: ""
    FEATURES_AIDB_ENABLED: "true"
    FEATURES_NEO4J_ENABLED: "true"
    SWEEP_OUTBOX_PUBLISHER_ENABLED: "true"
    SWEEP_RESULT_CONSUMER_ENABLED: "true"
    SWEEP_RESULT_CONSUMER_WAIT_TIME_SECONDS: "10"

secret:
  enabled: true
  name: card-channel-secret

probes:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 90
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
