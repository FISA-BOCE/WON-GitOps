replicaCount: 1

image:
  repository: 589077667723.dkr.ecr.ap-northeast-2.amazonaws.com/won-card-channel-server
  tag: dev

service:
  targetPort: 8081

spring:
  profile: dev

env:
  - name: SERVER_PORT
    value: "8081"

config:
  enabled: true
  data:
    LOG_LEVEL: INFO

probes:
  enabled: true
  path: /actuator/health

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
