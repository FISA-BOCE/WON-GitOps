replicaCount: 1

image:
  repository: 099622554242.dkr.ecr.ap-northeast-2.amazonaws.com/won-card-channel-server
  tag: manual-test

service:
  targetPort: 8081

spring:
  profile: prod

env:
  - name: SERVER_PORT
    value: "8081"

config:
  enabled: true
  data:
    MYSQL_PORT: "3306"
    MYSQL_DATABASE: won_card_channel_db
    AWS_REGION: ap-northeast-2
    CARD_CORE_BASE_URL: http://dummy-card-core:8080
    INVEST_CHANNEL_BASE_URL: http://dummy-invest-channel:8080
    COMMON_BASE_URL: http://dummy-common:8080

secret:
  enabled: true
  name: card-channel-secret

probes:
  enabled: true
  path: /actuator/health

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
